<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a5a"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ffd56b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd56b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="owl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4af5d"/>
      <stop offset="1" stop-color="#a78440"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5dca0"/>
      <stop offset="1" stop-color="#d4af5d"/>
    </linearGradient>
  </defs>

  <!-- Night-sky background, gently rounded -->
  <rect width="512" height="512" rx="100" fill="url(#sky)"/>
  <circle cx="256" cy="225" r="200" fill="url(#moon)"/>

  <!-- Stars -->
  <g fill="#fff3c4">
    <circle cx="80"  cy="100" r="3"/>
    <circle cx="432" cy="92"  r="2.5"/>
    <circle cx="90"  cy="300" r="2"/>
    <circle cx="448" cy="240" r="2.5"/>
    <circle cx="120" cy="420" r="2"/>
    <circle cx="404" cy="396" r="2.5"/>
    <circle cx="384" cy="140" r="1.8"/>
    <circle cx="140" cy="64"  r="1.8"/>
    <circle cx="240" cy="80"  r="2"/>
    <circle cx="290" cy="72"  r="1.8"/>
  </g>

  <!-- Sparkles -->
  <g stroke="#ffd56b" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="120" y1="190" x2="138" y2="208"/>
    <line x1="138" y1="190" x2="120" y2="208"/>
    <line x1="378" y1="180" x2="396" y2="198"/>
    <line x1="396" y1="180" x2="378" y2="198"/>
    <line x1="158" y1="350" x2="172" y2="364"/>
    <line x1="172" y1="350" x2="158" y2="364"/>
  </g>

  <!-- Owl -->
  <g transform="translate(256, 290)">
    <!-- Ear tufts -->
    <path d="M -92 -96 L -54 -76 L -50 -120 Z" fill="#a78440"/>
    <path d="M  92 -96 L  54 -76 L  50 -120 Z" fill="#a78440"/>
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="122" ry="142" fill="url(#owl)"/>
    <!-- Wings -->
    <path d="M -96 -8 Q -126 80 -94 138 L -68 58 Z" fill="#6a5024" opacity="0.55"/>
    <path d="M  96 -8 Q  126 80  94 138 L  68 58 Z" fill="#6a5024" opacity="0.55"/>
    <!-- Belly patch -->
    <ellipse cx="0" cy="64" rx="56" ry="82" fill="url(#belly)" opacity="0.95"/>
    <!-- Eye whites -->
    <circle cx="-48" cy="-38" r="46" fill="#fffdf3"/>
    <circle cx=" 48" cy="-38" r="46" fill="#fffdf3"/>
    <!-- Iris -->
    <circle cx="-48" cy="-34" r="32" fill="#1a2a5a"/>
    <circle cx=" 48" cy="-34" r="32" fill="#1a2a5a"/>
    <!-- Pupil -->
    <circle cx="-48" cy="-30" r="14" fill="#0a1530"/>
    <circle cx=" 48" cy="-30" r="14" fill="#0a1530"/>
    <!-- Eye highlights -->
    <circle cx="-42" cy="-44" r="6.5" fill="#fffdf3"/>
    <circle cx=" 54" cy="-44" r="6.5" fill="#fffdf3"/>
    <!-- Beak -->
    <path d="M -14 14 L 0 -10 L 14 14 Z" fill="#7f0909"/>
    <!-- Feet -->
    <ellipse cx="-34" cy="160" rx="15" ry="6.5" fill="#7f0909"/>
    <ellipse cx=" 34" cy="160" rx="15" ry="6.5" fill="#7f0909"/>
  </g>
</svg>
